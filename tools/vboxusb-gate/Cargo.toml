[package]
name = "vboxusb-gate"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Feasibility test: UR44 isochronous playback through the Microsoft-signed VBoxUSB.sys (as installed by usbipd-win), over its documented IOCTLs"
publish = false

# Standalone tool, not part of the ur44 package.
[workspace]

[dependencies]
anyhow = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_Security",
    "Win32_System_Console",
] }

[profile.release]
debug = true
